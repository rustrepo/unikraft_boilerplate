name: Deploy Unikernel
on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup KraftKit
        uses: unikraft/kraftkit@stable

      - name: Build and Deploy to KraftCloud
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: fra
        # The key change is adding --as dockerfile and --plat/--arch
        run: |
          kraft cloud deploy \
            --build \
            --as dockerfile \
            --plat kraftcloud \
            --arch x86_64 \
            --name hello-unikraft \
            --project . \
            --wait 10s
