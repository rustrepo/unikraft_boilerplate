name: Deploy Unikernel
on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Official KraftKit setup (automatically sets up PATH)
      - name: Setup KraftKit
        uses: unikraft/kraftkit@stable

      - name: Build and Deploy to KraftCloud
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: fra
        # We explicitly use --build and --runtime to ensure it finds your Dockerfile
        run: |
          kraft cloud deploy \
            --build \
            --runtime rust-1-82 \
            --project . \
            --wait 10s \
            --scale-to-zero on
