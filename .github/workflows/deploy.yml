name: Deploy Unikernel
on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Use the official action instead of manual curl
      - name: Setup KraftKit
        uses: unikraft/kraftkit@stable

      - name: Build and Deploy to KraftCloud
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: fra
        # This now knows exactly where 'kraft' is located
        run: kraft cloud deploy --project . --wait 10s
